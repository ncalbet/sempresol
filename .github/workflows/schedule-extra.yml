name: SempreSol – Post extra (opcional)

# Publica els posts EXTRA del dia (migdia i tarda), però NOMÉS si a
# data/schedule.csv hi ha una segona (o tercera) fila amb la data d'avui.
# Si no n'hi ha, el workflow acaba sense fer res.
#
# Per programar un post extra: afegeix al schedule.csv una fila amb la mateixa
# data que la del post diari, just a sota. L'ordre dins del fitxer mana:
#   2026-08-20,Berga,cat,"A {lugar}, ..."      ← post diari  (07:30, SLOT 1)
#   2026-08-20,Gandia,val,"A {lugar}, ..."     ← extra migdia (12:50, SLOT 2)
#   2026-08-20,Cardona,cat,"A {lugar}, ..."    ← extra tarda  (19:30, SLOT 3)
#
# Totes les hores són hora catalana.

on:
  schedule:
    # Hora catalana: la clau timezone ja s'ocupa del canvi d'hora.
    # A les 12:50 i no a les 13:00 en punt perquè Actions va carregat a
    # l'inici de cada hora i hi endarrereix les execucions programades.
    - cron: "50 12 * * *"       # post del migdia (SLOT 2)
      timezone: Europe/Madrid
    - cron: "30 19 * * *"       # post de la tarda (SLOT 3)
      timezone: Europe/Madrid

  # Permet executar-ho manualment des de Actions > Run workflow
  workflow_dispatch:
    inputs:
      slot:
        description: "Quin post del dia publicar (2 = primer extra, 3 = segon extra…)"
        required: false
        default: "2"
      template:
        description: "Plantilla d'imatge (0-5). Buit = la tria automàtica de sempre"
        required: false
        default: ""

concurrency:
  group: sempresol-post
  cancel-in-progress: false

jobs:
  extra:
    name: Publica el post extra del dia (si n'hi ha)
    runs-on: ubuntu-latest

    permissions:
      contents: write   # per fer commit de la imatge generada

    steps:
      # ── 1. Quin post del dia toca publicar? ───────────────────────────────
      # El SLOT surt de l'hora catalana real i no del cron que ha disparat el
      # workflow: així una execució endarrerida per càrrega d'Actions continua
      # publicant el post que li toca.
      - name: Decideix quin SLOT toca
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            slot="${{ github.event.inputs.slot }}"
          elif [ "$(( 10#$(TZ=Europe/Madrid date +%H) ))" -lt 16 ]; then
            slot=2
          else
            slot=3
          fi
          echo "Hora catalana: $(TZ=Europe/Madrid date +'%H:%M') → SLOT $slot"
          echo "SLOT=$slot" >> "$GITHUB_ENV"

      # ── 2. Checkout ───────────────────────────────────────────────────────
      - name: Checkout del repositori
        uses: actions/checkout@v7

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Configura Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sempresol-instagram/requirements.txt

      # ── 4. Dependències Python ────────────────────────────────────────────
      - name: Instal·la dependències Python
        working-directory: sempresol-instagram
        run: pip install -r requirements.txt

      # ── 5. Hi ha post extra avui? ─────────────────────────────────────────
      - name: Comprova si avui hi ha post extra
        id: check
        working-directory: sempresol-instagram
        env:
          MODE: check
        run: python post.py

      # ── 6. Fonts (només si cal generar la imatge) ─────────────────────────
      - name: Instal·la fonts
        if: steps.check.outputs.has_post == 'true'
        run: sudo apt-get install -y fonts-dejavu-core fonts-liberation

      # ── 7. Genera la imatge extra ─────────────────────────────────────────
      - name: Genera imatge del post extra
        if: steps.check.outputs.has_post == 'true'
        working-directory: sempresol-instagram
        env:
          MODE: generate
          TEMPLATE: ${{ github.event.inputs.template }}
        run: python post.py

      # ── 8. Commit + push de la imatge (perquè la URL raw sigui pública) ───
      - name: Desa imatge al repositori
        if: steps.check.outputs.has_post == 'true'
        run: |
          git config user.name  "SempreSol Bot"
          git config user.email "bot@sempresol.cat"
          git add sempresol-instagram/images/
          git diff --cached --quiet || git commit -m "🌞 Imatge extra $(date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push

      # ── 9. Publica a Instagram + renova el token ──────────────────────────
      - name: Publica a Instagram
        if: steps.check.outputs.has_post == 'true'
        working-directory: sempresol-instagram
        env:
          MODE: publish
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          IMAGES_SUBPATH:    sempresol-instagram/images
        run: python post.py

      # ── 10. Desa el token renovat al secret (auto-renovació) ──────────────
      - name: Renova el secret IG_ACCESS_TOKEN
        if: success() && steps.check.outputs.has_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f sempresol-instagram/new_token.txt ]; then
            gh secret set IG_ACCESS_TOKEN < sempresol-instagram/new_token.txt
            rm -f sempresol-instagram/new_token.txt
            echo "Secret IG_ACCESS_TOKEN actualitzat."
          else
            echo "Cap token nou per actualitzar (normal si el token té menys de 24h)."
          fi
