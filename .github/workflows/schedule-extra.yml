name: SempreSol – Post extra (opcional)

# Publica un SEGON post del dia, però NOMÉS si a data/schedule.csv hi ha una
# segona fila amb la data d'avui. Si no n'hi ha, el workflow acaba sense fer res.
#
# Per programar un post extra: afegeix al schedule.csv una fila amb la mateixa
# data que la del post diari, just a sota. Exemple:
#   2026-08-20,Berga,cat,"A {lugar}, ..."      ← post diari  (07:30 CEST)
#   2026-08-20,Gandia,val,"A {lugar}, ..."     ← post extra  (13:00 CEST)

on:
  # Cada dia a les 11:00 UTC → 13:00 CEST
  schedule:
    - cron: "0 11 * * *"

  # Permet executar-ho manualment des de Actions > Run workflow
  workflow_dispatch:
    inputs:
      slot:
        description: "Quin post del dia publicar (2 = primer extra, 3 = segon extra…)"
        required: false
        default: "2"
      template:
        description: "Plantilla d'imatge (0-5). Buit = la tria automàtica de sempre"
        required: false
        default: ""

concurrency:
  group: sempresol-post
  cancel-in-progress: false

env:
  SLOT: ${{ github.event.inputs.slot || '2' }}

jobs:
  extra:
    name: Publica el post extra del dia (si n'hi ha)
    runs-on: ubuntu-latest

    permissions:
      contents: write   # per fer commit de la imatge generada

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout del repositori
        uses: actions/checkout@v7

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Configura Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sempresol-instagram/requirements.txt

      # ── 3. Dependències Python ────────────────────────────────────────────
      - name: Instal·la dependències Python
        working-directory: sempresol-instagram
        run: pip install -r requirements.txt

      # ── 4. Hi ha post extra avui? ────────────────────────────────────────
      - name: Comprova si avui hi ha post extra
        id: check
        working-directory: sempresol-instagram
        env:
          MODE: check
        run: python post.py

      # ── 5. Fonts (només si cal generar la imatge) ────────────────────────
      - name: Instal·la fonts
        if: steps.check.outputs.has_post == 'true'
        run: sudo apt-get install -y fonts-dejavu-core fonts-liberation

      # ── 6. Genera la imatge extra ────────────────────────────────────────
      - name: Genera imatge del post extra
        if: steps.check.outputs.has_post == 'true'
        working-directory: sempresol-instagram
        env:
          MODE: generate
          TEMPLATE: ${{ github.event.inputs.template }}
        run: python post.py

      # ── 7. Commit + push de la imatge (perquè la URL raw sigui pública) ───
      - name: Desa imatge al repositori
        if: steps.check.outputs.has_post == 'true'
        run: |
          git config user.name  "SempreSol Bot"
          git config user.email "bot@sempresol.cat"
          git add sempresol-instagram/images/
          git diff --cached --quiet || git commit -m "🌞 Imatge extra $(date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push

      # ── 8. Publica a Instagram + renova el token ─────────────────────────
      - name: Publica a Instagram
        if: steps.check.outputs.has_post == 'true'
        working-directory: sempresol-instagram
        env:
          MODE: publish
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          IMAGES_SUBPATH:    sempresol-instagram/images
        run: python post.py

      # ── 9. Desa el token renovat al secret (auto-renovació) ──────────────
      - name: Renova el secret IG_ACCESS_TOKEN
        if: success() && steps.check.outputs.has_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f sempresol-instagram/new_token.txt ]; then
            gh secret set IG_ACCESS_TOKEN < sempresol-instagram/new_token.txt
            rm -f sempresol-instagram/new_token.txt
            echo "Secret IG_ACCESS_TOKEN actualitzat."
          else
            echo "Cap token nou per actualitzar (normal si el token té menys de 24h)."
          fi
