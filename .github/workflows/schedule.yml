name: SempreSol – Publica post diari a Instagram

on:
  schedule:
    # Cada dia a les 07:30, hora catalana (el canvi d'hora es gestiona sol
    # gràcies a la clau timezone).
    - cron: "30 7 * * *"
      timezone: Europe/Madrid
    # Reserva: Actions de vegades no arriba a disparar un cron. Com que
    # post.py no torna a publicar el que ja consta a data/publicats.csv, la
    # reserva només publica si el cron principal no ho ha fet.
    - cron: "30 9 * * *"
      timezone: Europe/Madrid

  # Permet executar-ho manualment des de Actions > Run workflow
  workflow_dispatch:

# Evita que aquest workflow i el del post extra facin push alhora.
concurrency:
  group: sempresol-post
  cancel-in-progress: false

jobs:
  post:
    name: Genera imatge i publica a Instagram
    runs-on: ubuntu-latest

    permissions:
      contents: write   # per fer commit de la imatge generada

    steps:
      # ── 0. Quin dia toca publicar? ───────────────────────────────────────
      # El dia surt del cron que ha disparat el workflow i no de l'hora real,
      # per si Actions endarrereix l'execució fins a l'endemà: si ara és abans
      # de l'hora del cron (amb una hora de marge), l'execució és d'ahir. En
      # un llançament manual no es fixa i post.py fa servir avui en UTC.
      - name: Decideix quin dia toca
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * *") hora=0730 ;;
            "30 9 * * *") hora=0930 ;;
            *) hora="" ;;
          esac
          echo "Cron: '${{ github.event.schedule }}' · Hora catalana: $(TZ=Europe/Madrid date +'%H:%M')"
          if [ -n "$hora" ]; then
            ara=$(TZ=Europe/Madrid date +%H%M)
            avui=$(TZ=Europe/Madrid date +%F)
            if [ $(( 10#${ara:0:2} * 60 + 10#${ara:2:2} )) -lt $(( 10#${hora:0:2} * 60 + 10#${hora:2:2} - 60 )) ]; then
              dia=$(date -u -d "$avui -1 day" +%F)
            else
              dia=$avui
            fi
            echo "Dia del post: $dia"
            echo "DIA=$dia" >> "$GITHUB_ENV"
          fi

      # ── 1. Checkout ──────────────────────────────────────────────────────
      # Amb la branca explícita, el checkout agafa el darrer commit en el
      # moment d'executar-se i no el de quan es va disparar: una execució que
      # ha esperat a la cua veu el schedule.csv i el publicats.csv d'ara.
      - name: Checkout del repositori
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Configura Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sempresol-instagram/requirements.txt

      # ── 3. Fonts ─────────────────────────────────────────────────────────
      - name: Instal·la fonts
        run: sudo apt-get install -y fonts-dejavu-core fonts-liberation

      # ── 4. Dependències Python ────────────────────────────────────────────
      - name: Instal·la dependències Python
        working-directory: sempresol-instagram
        run: pip install -r requirements.txt

      # ── 5. Genera la imatge del dia ──────────────────────────────────────
      - name: Genera imatge del dia
        working-directory: sempresol-instagram
        env:
          MODE: generate
        run: python post.py

      # ── 6. Commit + push de la imatge (perquè la URL raw sigui pública) ───
      - name: Desa imatge al repositori
        run: |
          git config user.name  "SempreSol Bot"
          git config user.email "bot@sempresol.cat"
          git add sempresol-instagram/images/
          git diff --cached --quiet || git commit -m "🌞 Imatge $(date +'%Y-%m-%d')"
          git push

      # ── 7. Publica a Instagram + renova el token ─────────────────────────
      - name: Publica a Instagram
        working-directory: sempresol-instagram
        env:
          MODE: publish
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          IMAGES_SUBPATH:    sempresol-instagram/images
        run: python post.py

      # ── 8. Desa el token renovat al secret (auto-renovació) ──────────────
      - name: Renova el secret IG_ACCESS_TOKEN
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f sempresol-instagram/new_token.txt ]; then
            gh secret set IG_ACCESS_TOKEN < sempresol-instagram/new_token.txt
            rm -f sempresol-instagram/new_token.txt
            echo "Secret IG_ACCESS_TOKEN actualitzat."
          else
            echo "Cap token nou per actualitzar (normal si el token té menys de 24h)."
          fi

      # ── 9. Desa el registre de publicats (evita repetir el post) ──────────
      - name: Desa el registre de publicats
        if: always()
        run: |
          git config user.name  "SempreSol Bot"
          git config user.email "bot@sempresol.cat"
          git add sempresol-instagram/data/publicats.csv
          git diff --cached --quiet && exit 0
          git commit -m "📋 Publicat $(date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
