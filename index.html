    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

    <style>
        /* Paleta: la mateixa que les imatges de l'Instagram (generate_image.py) */
        :root {
            --gold: #FFD700;
            --cream: #FFF8DC;
            --paper: #FFFCE6;
            --amber: #FFB800;
            --coral: #E45F1E;
            --coral-ink: #B84A12;   /* coral fosc: text i botons (contrast 5,2 sobre blanc) */
            --ink: #2f2a24;
            --muted: #6b5b45;
            --line: #F1DFA0;
            --card: #FFFFFF;
            --wa: #0B6E5F;
            --radius: 18px;
            --wrap: 1040px;
            --shadow: 0 2px 6px rgba(120, 80, 0, 0.06), 0 10px 30px rgba(120, 80, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 32px;
        }

        :focus-visible {
            outline: 3px solid var(--coral);
            outline-offset: 2px;
        }

        /* === CAPÇALERA === */
        .header {
            width: 100%;
            max-width: var(--wrap);
            text-align: center;
            margin-bottom: 16px;
            padding: 28px 20px 22px;
            border-radius: var(--radius);
            background: linear-gradient(to bottom, var(--gold) 0%, var(--cream) 62%, var(--paper) 100%);
            box-shadow: var(--shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: clamp(30px, 6vw, 48px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo a {
            color: var(--ink);
            text-decoration: none;
        }

        .logo a:hover { color: var(--coral-ink); }

        .logo-mark {
            width: 1em;
            height: 1em;
            flex: none;
        }

        .tagline {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .tagline::after {
            content: "";
            display: block;
            width: 64px;
            height: 3px;
            margin: 14px auto 0;
            background: var(--amber);
            border-radius: 2px;
        }

        /* === CERCADOR === */
        .search-section {
            width: 100%;
            max-width: var(--wrap);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            font-size: 16px;
            font-family: inherit;
            color: var(--ink);
            background: var(--paper);
            border: 1.5px solid var(--line);
            border-radius: 12px;
        }

        .search-container input::placeholder { color: #85755d; }

        .search-container input:focus {
            outline: none;
            border-color: var(--coral);
            box-shadow: 0 0 0 4px rgba(228, 95, 30, 0.16);
        }

        #search-btn {
            padding: 14px 28px;
            background: var(--coral-ink);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        #search-btn:hover { background: #9c3c0b; }
        #search-btn:active { transform: scale(0.98); }

        #geo-btn {
            width: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream);
            color: var(--coral-ink);
            border: 1.5px solid var(--amber);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        #geo-btn:hover { background: var(--gold); }
        #geo-btn.loading { opacity: 0.6; pointer-events: none; }

        /* === RESULTAT === */
        #search-result {
            display: none;
            width: 100%;
            max-width: var(--wrap);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            animation: slideDown 0.35s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-hero {
            background: linear-gradient(to bottom, var(--gold) 0%, var(--cream) 100%);
            padding: 34px 20px 30px;
            text-align: center;
            color: var(--ink);
        }

        .result-sun-big {
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 10px;
            animation: floatSun 4s ease-in-out infinite;
        }

        @keyframes floatSun {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-8px) rotate(8deg); }
        }

        .result-city {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .result-city::after {
            content: "";
            display: block;
            width: 56px;
            height: 3px;
            margin: 14px auto 0;
            background: var(--amber);
            border-radius: 2px;
        }

        .result-temp-display {
            font-size: clamp(64px, 14vw, 92px);
            font-weight: 200;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 18px 0 14px;
        }

        .result-condition-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .result-message-card {
            max-width: 720px;
            margin: 0 auto;
            padding: 26px 22px 6px;
            text-align: center;
            font-size: clamp(17px, 2.6vw, 20px);
            font-weight: 500;
            line-height: 1.6;
            color: var(--ink);
        }

        #search-result.loading-state .result-hero {
            background: linear-gradient(90deg, #ffe680 25%, #fff3c0 50%, #ffe680 75%);
            background-size: 600px 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0%   { background-position: -600px 0; }
            100% { background-position: 600px 0; }
        }

        #search-result.loading-state .result-sun-big,
        #search-result.loading-state .result-city,
        #search-result.loading-state .result-temp-display,
        #search-result.loading-state .result-condition-label,
        #search-result.loading-state #search-description {
            opacity: 0;
        }

        /* === COMPARTIR === */
        .share-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 18px 20px 24px;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: transform 0.12s, filter 0.15s;
        }

        .share-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .share-btn:hover { filter: brightness(0.9); }
        .share-btn:active { transform: scale(0.97); }

        .share-wa { background: var(--wa); }
        .share-native { background: var(--ink); }

        /* === PREVISIÓ === */
        #charts-section {
            width: 100%;
            max-width: var(--wrap);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .charts-block-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--coral-ink);
            margin-bottom: 12px;
        }

        .forecast-day-block { margin-bottom: 20px; }

        .forecast-day-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .hourly-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }

        .hourly-card {
            flex: 1 0 68px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
        }
        .hc-hour { font-size: 12px; font-weight: 700; color: var(--muted); }
        .hc-icon { font-size: 22px; }
        .hc-temp { font-size: 16px; font-weight: 800; }
        .hc-wind { font-size: 11px; color: var(--muted); }

        .fivedays-list {
            display: flex;
            flex-direction: column;
        }

        .day-row {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 13px 8px;
            background: none;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            font: inherit;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .day-row:last-child { border-bottom: none; }
        .day-row:hover { background: var(--paper); }
        .day-row[aria-pressed="true"] { background: var(--paper); border-radius: 12px; }

        .dr-day { flex: 1; font-size: 16px; font-weight: 700; text-transform: capitalize; }
        .dr-date { font-size: 13px; color: var(--muted); margin-right: 16px; }
        .dr-icon { font-size: 24px; margin-right: 12px; }
        .dr-temp { font-size: 18px; font-weight: 800; color: var(--coral-ink); min-width: 56px; text-align: right; }

        /* === MAPA === */
        .container {
            width: 100%;
            max-width: var(--wrap);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        #map {
            width: 100%;
            height: min(520px, 62vh);
            min-height: 300px;
        }

        .popup-city {
            font-weight: 700;
            color: var(--coral-ink);
            text-decoration: underline;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .popup-temp { font-size: 20px; font-weight: 800; color: var(--ink); }
        .popup-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .leaflet-popup-content-wrapper { border-radius: 12px !important; }

        /* === SELECTOR DE DIA === */
        .day-bar {
            padding: 14px 16px 12px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
        }

        .day-picker {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .day-picker::-webkit-scrollbar { display: none; }

        .day-chip {
            flex: 1 0 62px;
            padding: 8px 6px;
            background: var(--card);
            color: var(--ink);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.25;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .day-chip small {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .day-chip:hover { border-color: var(--amber); }
        .day-chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }
        .day-chip[aria-pressed="true"] small { color: #FFF8DC; }

        .day-other {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }
        .day-other input {
            padding: 6px 8px;
            font-family: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--paper);
            border: 1.5px solid var(--line);
            border-radius: 8px;
        }

        /* === AVÍS (substitueix els alert()) === */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 2000;
            max-width: min(92vw, 420px);
            padding: 12px 18px;
            background: var(--ink);
            color: #fff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 16px);
            transition: opacity 0.2s, transform 0.2s;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* === PEU === */
        footer {
            width: 100%;
            max-width: var(--wrap);
            margin-top: 28px;
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        .footer-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: var(--coral-ink);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-links a:hover { text-decoration: underline; }

        .footer-divider {
            width: 1px;
            height: 18px;
            background: var(--line);
        }

        .footer-bottom { font-size: 12px; }

        /* === MÒBIL === */
        @media (max-width: 560px) {
            body { padding: 12px 10px 24px; }
            .header { padding: 20px 14px 16px; }
            .search-container { flex-wrap: wrap; }
            .search-container input { flex: 1 1 100%; }
            #search-btn { flex: 1; }
            .result-hero { padding: 26px 14px 24px; }
            .result-sun-big { width: 56px; height: 56px; }
            .result-message-card { padding: 22px 16px 4px; }
            #charts-section { padding: 18px 14px; }
            .footer-divider { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        // Dades de totes les capitals del món (excepte Madrid)
        const cities = [
            // Europa

        // === Nom del lloc dins de les frases ===
        // Mirall de sempresol-instagram/lloc.py: contrau (a + el -> al), elideix
        // (de Alforja -> d'Alforja) i posa la majúscula a l'inici de frase.
        // Serveix igual per a un poble que per a un territori.
        const LLOC_PREP = /(^|[^\wÀ-ÿ'’·])(des de|de|per|a)\s+$/i;
        const LLOC_CONTRACCIONS = {
            'a':      { el: 'al',  els: 'als' },
            'de':     { el: 'del', els: 'dels' },
            'des de': { el: 'des del', els: 'des dels' },
            'per':    { el: 'pel', els: 'pels' }
        };

        function analitzaLloc(nom) {
            nom = nom.trim().replace(/\s+/g, ' ');
            let art = '', resta = nom, m;
            if ((m = nom.match(/^(els|les|el|la)\s+(\S.*)$/i))) {
                art = m[1].toLowerCase(); resta = m[2];
            } else if ((m = nom.match(/^l['’](\S.*)$/i))) {
                art = "l'"; resta = m[1];
            }
            if (resta) resta = resta.charAt(0).toUpperCase() + resta.slice(1);
            return { art: art, resta: resta };
        }

        function formaLloc(nom, prep) {
            const { art, resta } = analitzaLloc(nom);
            const ambArticle = !art ? resta : (art.endsWith("'") ? art + resta : art + ' ' + resta);
            if (!prep) return ambArticle;
            prep = prep.toLowerCase();
            const contret = LLOC_CONTRACCIONS[prep][art];
            if (contret) return contret + ' ' + resta;
            if ((prep === 'de' || prep === 'des de') && !art && /^[aeiouàèéíòóúïüh]/i.test(resta)) {
                return (prep === 'des de' ? "des d'" : "d'") + resta;
            }
            return prep + ' ' + ambArticle;
        }

        function omple(plantilla, nom) {
            const parts = plantilla.split('{lugar}');
            let res = parts[0];
            for (let i = 1; i < parts.length; i++) {
                const pm = res.match(LLOC_PREP);
                if (pm) {
                    const prep = pm[2];
                    let nou = formaLloc(nom, prep);
                    if (prep.charAt(0) !== prep.charAt(0).toLowerCase()) {   // «A», «Des de»…
                        nou = nou.charAt(0).toUpperCase() + nou.slice(1);
                    }
                    res = res.slice(0, pm.index + pm[1].length) + nou;
                } else {
                    let nou = formaLloc(nom);
                    if (/(^|[.!?…]\s+)$/.test(res)) nou = nou.charAt(0).toUpperCase() + nou.slice(1);
                    res += nou;
                }
                res += parts[i];
            }
            return res;
        }

        let toastTimer;
        function notify(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // Funció per buscar des del mapa
        function searchFromMap(cityName) {
            document.getElementById('search-input').value = cityName;
            performSearch();
        }

        // === Dia de la previsió ===
        const NOMS_DIA = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
        const NOMS_DIA_CURT = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
        const MESOS_DE = ['de gener', 'de febrer', 'de març', "d'abril", 'de maig', 'de juny',
                          'de juliol', "d'agost", 'de setembre', "d'octubre", 'de novembre', 'de desembre'];
        const MESOS_CURTS = ['gen', 'feb', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'];
        // Desviacions respecte la temperatura base (les de la llista de 5 dies de sempre: 26, 25, 27, 24, 25)
        const DELTES_DIA = [0, -1, 1, -2, -1];
        const CORBA_HORARIA = [10, 8, 9, 15, 22, 26, 20, 14];
        // Les frases que parlen d'«avui», «ahir»… no val per a un altre dia
        const MARCA_TEMPS = /(^|[^\wÀ-ÿ])(avui|hui|ahir|demà|aquest matí|aquesta nit)(?![\wÀ-ÿ])/i;

        let diaSeleccionat = null;   // Date a mitjanit local; null = avui

        function iniciDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
        function dataIso(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function dataDeIso(s) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
            if (!m) return null;
            const d = new Date(+m[1], +m[2] - 1, +m[3]);
            return (d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3]) ? d : null;
        }
        function diesFinsAra(d) {
            return Math.round((iniciDia(d) - iniciDia(new Date())) / 86400000);
        }
        function majuscula(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
        // «avui», «demà» o «dissabte 17 d'octubre»
        function etiquetaDia(d) {
            const n = diesFinsAra(d);
            if (n === 0) return 'avui';
            if (n === 1) return 'demà';
            return NOMS_DIA[d.getDay()] + ' ' + d.getDate() + ' ' + MESOS_DE[d.getMonth()];
        }

        // Temperatures: el mateix decorat de sempre (≈ 26 °C), però coherent entre hero, hores i llista
        function hashText(t) {
            let h = 5381;
            for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
            return Math.abs(h);
        }
        function ciutatDe(lloc) {
            return cities.find(c => c.name.toLowerCase() === lloc.toLowerCase());
        }
        function baseTemp(lloc) {
            const c = ciutatDe(lloc);
            return c ? c.temp : 26;
        }
        function tempAra(lloc) {
            const hora = new Date().getHours();
            const franges = [0, 3, 6, 9, 12, 15, 18, 21];
            let t = CORBA_HORARIA[0];
            for (let i = 0; i < franges.length; i++) { if (hora >= franges[i]) t = CORBA_HORARIA[i]; }
            const c = ciutatDe(lloc);
            return c ? c.temp : t;
        }
        function tempDia(lloc, d) {
            const n = diesFinsAra(d);
            if (n <= 0) return tempAra(lloc);
            const base = baseTemp(lloc);
            if (n <= 5) return base + DELTES_DIA[n - 1];
            return base + (hashText(lloc.toLowerCase() + '|' + dataIso(d)) % 5) - 2;
        }

        // Frase del dia: guardada al navegador per lloc i dia (com abans, però per al dia escollit)
        function triaMissatge(lloc, dia) {
            const esAvui = diesFinsAra(dia) === 0;
            const clau = `weather_${lloc.toLowerCase()}_${dataIso(dia)}`;
            try {
                const guardat = localStorage.getItem(clau);
                if (guardat) return JSON.parse(guardat).message;
            } catch (e) { /* sense emmagatzematge: se'n tria una de nova */ }

            // Només plantilles que encaixen amb el nom (p. ex. si és plural) i amb el dia
            let candidats = [];
            weatherMessages.forEach((t, i) => {
                if (plantillaCompatible(t, lloc) && (esAvui || !MARCA_TEMPS.test(t))) candidats.push(i);
            });
            if (!candidats.length) candidats = weatherMessages.map((_, i) => i);
            const idx = candidats[Math.floor(Math.random() * candidats.length)];
            const missatge = omple(weatherMessages[idx], lloc) +
                ' La previsió per als propers dies assegura que aquest temps excepcional es mantindrà estable.';
            try {
                localStorage.setItem(clau, JSON.stringify({ message: missatge, index: idx }));
            } catch (e) { /* idem */ }
            return missatge;
        }

        // Fila de dies (avui, demà i cinc més) i selector d'una altra data
        function pintaSelectorDia(dia) {
            const avui = iniciDia(new Date());
            const seleccionat = dataIso(dia);
            let h = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(avui.getFullYear(), avui.getMonth(), avui.getDate() + i);
                const iso = dataIso(d);
                const etiqueta = i === 0 ? 'Avui' : i === 1 ? 'Demà' : NOMS_DIA_CURT[d.getDay()];
                h += `<button type="button" class="day-chip" data-dia="${iso}" aria-pressed="${iso === seleccionat}">` +
                     `<small>${etiqueta}</small>${d.getDate()}</button>`;
            }
            document.getElementById('day-picker').innerHTML = h;
            const input = document.getElementById('day-input');
            input.min = dataIso(avui);
            input.value = seleccionat;
        }

        // A pantalles estretes la fila fa scroll: que el dia escollit quedi a la vista
        function centraDiaSeleccionat() {
            const cont = document.getElementById('day-picker');
            const b = cont.querySelector('.day-chip[aria-pressed="true"]');
            if (!b) return;
            cont.scrollLeft += (b.getBoundingClientRect().left - cont.getBoundingClientRect().left)
                             - (cont.clientWidth - b.offsetWidth) / 2;
        }

        function seleccionaDia(d) {
            if (!d) return;
            diaSeleccionat = iniciDia(d);
            const lloc = document.getElementById('search-location').textContent;
            if (lloc) mostraResultat(lloc, false);
        }

        document.getElementById('day-picker').addEventListener('click', function (e) {
            const b = e.target.closest('.day-chip');
            if (b) seleccionaDia(dataDeIso(b.dataset.dia));
        });
        document.getElementById('five-days-chart').addEventListener('click', function (e) {
            const b = e.target.closest('.day-row');
            if (b) seleccionaDia(dataDeIso(b.dataset.dia));
        });
        document.getElementById('day-input').addEventListener('change', function () {
            const d = dataDeIso(this.value);
            if (d && diesFinsAra(d) >= 0) {
                seleccionaDia(d);
            } else {
                notify("Escull un dia a partir d'avui.");
                this.value = dataIso(diaSeleccionat || new Date());
            }
        });

        // Gràfic horari: avui i demà, o el dia escollit
        function generateHourlyChart(lloc, dia) {
            const hourlyChart = document.getElementById('hourly-chart');
            const hours = [0, 3, 6, 9, 12, 15, 18, 21];
            const windCurve = [3, 2, 2, 4, 6, 7, 5, 3];
            const n = diesFinsAra(dia);

            function dayHTML(label, temps) {
                let h = `<div class="forecast-day-block">`;
                h += `<div class="forecast-day-label">${label}</div>`;
                h += `<div class="hourly-scroll">`;
                hours.forEach((hour, idx) => {
                    const icon = '☀️'; // sempre sol, també de nit
                    h += `<div class="hourly-card">
                        <div class="hc-hour">${hour}h</div>
                        <div class="hc-icon">${icon}</div>
                        <div class="hc-temp">${temps[idx]}°</div>
                        <div class="hc-wind">💨 ${windCurve[idx]}</div>
                    </div>`;
                });
                h += `</div></div>`;
                return h;
            }

            const titol = document.getElementById('hourly-title');
            if (n === 0) {
                const desp = baseTemp(lloc) - 26;
                const avui = CORBA_HORARIA.map(t => t + desp);
                hourlyChart.innerHTML = dayHTML('AVUI', avui) + dayHTML('DEMÀ', avui.map(t => t + 1));
                titol.textContent = 'Previsió per avui i demà';
            } else {
                const desp = tempDia(lloc, dia) - 26;
                hourlyChart.innerHTML = dayHTML(etiquetaDia(dia).toUpperCase(), CORBA_HORARIA.map(t => t + desp));
                titol.textContent = n === 1 ? 'Previsió per demà' : 'Previsió per al ' + etiquetaDia(dia);
            }
        }

        // Propers 5 dies: cada fila també serveix per escollir el dia
        function generateFiveDaysChart(lloc, dia) {
            const container = document.getElementById('five-days-chart');
            const base = baseTemp(lloc);
            const avui = iniciDia(new Date());
            const seleccionat = dataIso(dia);
            let html = '';
            for (let i = 1; i <= 5; i++) {
                const d = new Date(avui.getFullYear(), avui.getMonth(), avui.getDate() + i);
                const iso = dataIso(d);
                html += `<button type="button" class="day-row" data-dia="${iso}" aria-pressed="${iso === seleccionat}">
                    <span class="dr-day">${NOMS_DIA[d.getDay()]}</span>
                    <span class="dr-date">${d.getDate()} ${MESOS_CURTS[d.getMonth()]}</span>
                    <span class="dr-icon">☀️</span>
                    <span class="dr-temp">${base + DELTES_DIA[i - 1]}°C</span>
                </button>`;
            }
            container.innerHTML = html;
        }

        // Pinta el resultat per a un lloc i el dia escollit. `animat`: amb l'esquelet de càrrega i el desplaçament.
        function mostraResultat(lloc, animat) {
            if (!diaSeleccionat || diesFinsAra(diaSeleccionat) < 0) diaSeleccionat = iniciDia(new Date());
            const dia = diaSeleccionat;
            const n = diesFinsAra(dia);
            const resultDiv = document.getElementById('search-result');

            document.getElementById('search-location').textContent = lloc;
            document.getElementById('search-description').textContent = triaMissatge(lloc, dia);
            document.getElementById('search-temp').textContent = tempDia(lloc, dia);
            document.getElementById('search-day-label').textContent =
                n === 0 ? 'Assolellat · Sempre Sol' : majuscula(etiquetaDia(dia)) + ' · Assolellat';
            pintaSelectorDia(dia);
            generateHourlyChart(lloc, dia);
            generateFiveDaysChart(lloc, dia);

            // L'adreça reflecteix el que es veu, així es pot copiar directament
            try {
                history.replaceState(null, '', '?lloc=' + encodeURIComponent(lloc) + '&dia=' + dataIso(dia));
            } catch (e) { /* res */ }

            if (animat) {
                resultDiv.classList.add('loading-state');
                resultDiv.style.display = 'block';
                centraDiaSeleccionat();
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                setTimeout(() => {
                    resultDiv.classList.remove('loading-state');
                    document.getElementById('charts-section').style.display = 'block';
                }, 400);
            } else {
                resultDiv.style.display = 'block';
                centraDiaSeleccionat();
                document.getElementById('charts-section').style.display = 'block';
            }
        }

        function performSearch() {
            const searchValue = document.getElementById('search-input').value.trim();
            if (searchValue === '') {
                notify('Si us plau, escriu un indret per buscar');
                return;
            }
            mostraResultat(searchValue, true);
        }

        // Geolocalització
        document.getElementById('geo-btn').addEventListener('click', function() {
            if (!navigator.geolocation) {
                notify('El teu navegador no suporta la geolocalització.');
                return;
            }
            const btn = this;
            btn.classList.add('loading');
            navigator.geolocation.getCurrentPosition(
                async function(pos) {
                    try {
                        const { latitude: lat, longitude: lon } = pos.coords;
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ca`,
                            { headers: { 'User-Agent': 'sempresol.cat' } }
                        );
                        const data = await res.json();
                        const addr = data.address;
                        const city = addr.city || addr.town || addr.village || addr.municipality || addr.county || 'la teva ubicació';
                        document.getElementById('search-input').value = city;
                        performSearch();
                    } catch(e) {
                        notify('No s\'ha pogut determinar la teva ubicació. Torna-ho a intentar.');
                    } finally {
                        btn.classList.remove('loading');
                    }
                },
                function(err) {
                    btn.classList.remove('loading');
                    if (err.code === err.PERMISSION_DENIED) {
                        notify('Has denegat l\'accés a la ubicació. Pots activar-lo a la configuració del navegador.');
                    } else {
                        notify('No s\'ha pogut obtenir la ubicació. Torna-ho a intentar.');
                    }
                },
                { timeout: 10000 }
            );
        });

        // Event listeners per al buscador
        document.getElementById('search-btn').addEventListener('click', performSearch);
        document.getElementById('search-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        // Deep link: ?lloc=NomCiutat&dia=AAAA-MM-DD
        (function() {
            const params = new URLSearchParams(window.location.search);
            const lloc = params.get('lloc');
            if (lloc) {
                const d = dataDeIso(params.get('dia'));
                if (d && diesFinsAra(d) >= 0) diaSeleccionat = d;
                document.getElementById('search-input').value = lloc.slice(0, 80);
                performSearch();
            }
        })();

        // Construeix la URL de compartir per al lloc i el dia que es veuen
        function buildShareUrl(city, dia) {
            return 'https://sempresol.cat?lloc=' + encodeURIComponent(city) + '&dia=' + dataIso(dia);
        }

        // «A Reus fa sol i 26°C!» (avui) · «Dissabte 17 d'octubre a Reus fa sol i 25°C!» (un altre dia)
        function textDia(city, temp, dia) {
            if (diesFinsAra(dia) === 0) return omple('A {lugar} fa sol i ' + temp + '°C!', city);
            return majuscula(etiquetaDia(dia)) + ' ' + omple('a {lugar}', city) + ' fa sol i ' + temp + '°C!';
        }

        // WhatsApp
        document.getElementById('share-whatsapp').addEventListener('click', function() {
            const city = document.getElementById('search-location').textContent;
            const temp = document.getElementById('search-temp').textContent;
            const dia = diaSeleccionat || iniciDia(new Date());
            const url = buildShareUrl(city, dia);
            const text = `☀️ ${textDia(city, temp, dia)}\nMira la previsió a Sempre Sol 👉 ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        });

        // Compartir natiu (Web Share API)
        document.getElementById('share-native').addEventListener('click', async function() {
            const city = document.getElementById('search-location').textContent;
            const temp = document.getElementById('search-temp').textContent;
            const dia = diaSeleccionat || iniciDia(new Date());
            const url = buildShareUrl(city, dia);
            const shareData = {
                title: `☀️ ${city} — Sempre Sol`,
                text: textDia(city, temp, dia) + ' Mira la previsió completa:',
                url: url
            };
            if (navigator.share) {
                try { await navigator.share(shareData); } catch(e) {}
            } else {
                navigator.clipboard.writeText(url).then(() => notify('Enllaç copiat!'));
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
